[project]
name = "scraper-automation-backend"
version = "0.1.0"
description = "API, scheduler, and worker processes for the scraper automation system (Phase 0 walking skeleton)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<1.14",
    "celery[redis]>=5.4,<5.5",
    "redis>=5.1,<6",
    "flower>=2.0,<3",
    "python-json-logger>=2.0,<3",
    # Phase 1 (doc 17): the SSRF-hardened fetcher (app/scraping/fetcher.py)
    # and the mock-store adapter's HTML/JSON-LD parsing. httpx was
    # dev-only (via TestClient) through Phase 0; it's a real runtime
    # dependency starting here. selectolax per doc 04 §4.4's already-
    # approved parser choice (Modest/lexbor-based, faster than
    # BeautifulSoup for the static path).
    "httpx>=0.27,<0.28",
    "selectolax>=0.3,<0.4",
    "pyjwt>=2.13.0",
    "pwdlib[argon2]>=0.3.1",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: requires a live Postgres + Redis (run inside the api container)",
]
# pytest-asyncio was a Phase 0 dependency with nothing yet to test (every
# Phase 0 test used the synchronous TestClient). Phase 1 (doc 17) adds
# real `async def` tests (the fetcher, upsert_scrape_result()) -- "auto"
# runs any `async def test_*` directly, no per-test @pytest.mark.asyncio
# needed.
asyncio_mode = "auto"
